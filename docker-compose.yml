name: umai

services:
  umai:
    build: .
    container_name: umai
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    ports:
      - "3333:3000"
    environment:
      - DATABASE_PATH=/app/data/umai.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
