name: Deploy to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted
    concurrency:
      group: deploy-nas
      cancel-in-progress: false
    steps:
      # Migrations run when the new container starts, so this copy is the restore point
      # if one of them breaks the data. It runs in a one-off container from the current
      # image because the NAS has no sqlite3 CLI, and the SQLite backup API stays
      # consistent while the app keeps writing (a plain cp would not, with WAL).
      - name: Back up the database before the deploy
        id: backup
        working-directory: /home/michroucka/umai
        run: |
          set -e
          echo "previous_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The image ID of the running container, not a tag: the tag moves with every build.
          echo "previous_image=$(docker inspect --format '{{.Image}}' umai 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

          if [ ! -f data/umai.db ]; then
            echo "No database yet, nothing to back up"
            exit 0
          fi

          backup_name="pre-deploy-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD).db"
          docker compose run --rm --no-deps -T -e BACKUP_NAME="$backup_name" umai node -e '
            const fs = require("node:fs");
            const Database = require("better-sqlite3");
            const backupDir = "/app/data/backups";
            const keepCount = 10;

            fs.mkdirSync(backupDir, { recursive: true });
            const target = `${backupDir}/${process.env.BACKUP_NAME}`;
            const source = new Database(process.env.DATABASE_PATH, { fileMustExist: true });
            source.backup(target).then(() => {
              // The copy inherits WAL mode; DELETE makes it one self-contained file
              // with no -wal/-shm files next to it.
              const copy = new Database(target);
              copy.pragma("journal_mode = DELETE");
              const integrity = copy.pragma("integrity_check", { simple: true });
              copy.close();
              if (integrity !== "ok") throw new Error(`integrity_check of ${target}: ${integrity}`);
              console.log(`Backed up to data/backups/${process.env.BACKUP_NAME}`);

              // Names start with a UTC timestamp, so sorting them sorts by age.
              const oldBackups = fs
                .readdirSync(backupDir)
                .filter((name) => name.startsWith("pre-deploy-") && name.endsWith(".db"))
                .sort()
                .slice(0, -keepCount);
              for (const name of oldBackups) fs.rmSync(`${backupDir}/${name}`);
              if (oldBackups.length) console.log(`Removed ${oldBackups.length} old backup(s)`);
            });
          '
          echo "backup_name=$backup_name" >> "$GITHUB_OUTPUT"

      - name: Check out the tested commit and redeploy
        id: deploy
        working-directory: /home/michroucka/umai
        run: |
          set -e
          # --prune drops refs of deleted branches; a stale origin/dependabot blocks fetching dependabot/... branches.
          git fetch --prune origin
          git checkout --detach "${{ github.sha }}"

          # The healthcheck only asks for "/", which redirects; /pair must render a page.
          smoke_test() {
            docker compose exec -T umai wget -q --spider http://127.0.0.1:3000/pair
          }

          attempts=3
          for ((i=1; i<=attempts; i++)); do
            echo "Deploy attempt $i/$attempts"
            if docker compose build --pull; then
              # From here on the new container may run its migrations, so a rollback has to restore the database.
              echo "new_container_started=true" >> "$GITHUB_OUTPUT"
              if docker compose up -d --wait && smoke_test; then
                echo "Deploy succeeded"
                exit 0
              fi
            fi
            echo "Attempt $i failed"
            [ "$i" -lt "$attempts" ] && sleep 10
          done

          echo "Deploy failed after $attempts attempts, recent logs:"
          docker compose logs --tail=50
          exit 1

      # The new container may have already run its migrations, and the previous code
      # might not work with the migrated schema, so the database goes back too.
      # Writes made between the backup and the failure are lost; that is minutes at most.
      # When the deploy failed before the new container started (fetch or build), the old
      # container still runs on an untouched database, so only the checkout goes back.
      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome == 'failure' && steps.backup.outputs.previous_image != ''
        working-directory: /home/michroucka/umai
        env:
          PREVIOUS_SHA: ${{ steps.backup.outputs.previous_sha }}
          PREVIOUS_IMAGE: ${{ steps.backup.outputs.previous_image }}
          BACKUP_NAME: ${{ steps.backup.outputs.backup_name }}
          NEW_CONTAINER_STARTED: ${{ steps.deploy.outputs.new_container_started }}
        run: |
          set -e
          echo "Rolling back to $PREVIOUS_SHA"

          if [ "$NEW_CONTAINER_STARTED" != "true" ]; then
            git checkout --detach "$PREVIOUS_SHA"
            docker compose exec -T umai wget -q --spider http://127.0.0.1:3000/pair
            echo "The new version never started; the running container and the database are unchanged."
            echo "Back on $PREVIOUS_SHA. The deploy itself failed, see the step above."
            exit 0
          fi

          docker compose stop umai
          git checkout --detach "$PREVIOUS_SHA"

          if [ -n "$BACKUP_NAME" ]; then
            # data/ belongs to root (the container writes it), so the copy runs in a container.
            # Stale -wal/-shm files would be replayed onto the restored database and corrupt it.
            docker compose run --rm --no-deps -T umai sh -c \
              "rm -f /app/data/umai.db-wal /app/data/umai.db-shm && cp /app/data/backups/$BACKUP_NAME /app/data/umai.db"
            echo "Database restored from data/backups/$BACKUP_NAME"
          fi

          # The tag compose would build to now points at the failed image; move it back.
          docker image tag "$PREVIOUS_IMAGE" "$(docker compose config --images)"
          docker compose up -d --wait --no-build
          docker compose exec -T umai wget -q --spider http://127.0.0.1:3000/pair
          echo "Rolled back to $PREVIOUS_SHA. The deploy itself failed, see the step above."
