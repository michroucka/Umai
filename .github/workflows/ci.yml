name: CI

# Pushes to main run CI through deploy.yml, which deploys only when it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # The main ruleset requires this exact check name; keep it when adding steps.
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # A schema change without `drizzle-kit generate` would deploy with no migration.
      - name: Migrations match the schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "db/schema.ts has changes without a migration; run npx drizzle-kit generate and commit the result."
            exit 1
          fi

      # The coverage table in the log shows what is untested; there are no thresholds yet.
      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Starts the build from the previous step with its own empty database (see playwright.config.ts).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Catches a broken Dockerfile (e.g. a missing COPY) before the deploy on the NAS does.
  # An empty database also checks that all migrations apply from scratch at startup.
  docker:
    # The main ruleset requires this exact check name too.
    name: Docker image starts
    # The deploy builds the image on the NAS anyway, so only PRs need this.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t umai-ci .

      - name: Start it with an empty database
        run: |
          docker run -d --name umai-ci -e DATABASE_PATH=/tmp/umai.db -p 3000:3000 umai-ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/pair; then
              echo "/pair responds after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "/pair did not respond within 30s, container logs:"
          docker logs umai-ci
          exit 1
